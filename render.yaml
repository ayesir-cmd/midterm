services:
  - type: web
    name: agriculture-information-system
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_NAME
        value: Rootsy
      - key: APP_URL
        value: https://midterm-g6wu.onrender.com
      - key: SESSION_NAME
        value: rootsy_session
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_HTTP_ONLY
        value: true
      - key: SESSION_SAME_SITE
        value: Lax
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: verify-full
      - key: DB_SSLROOTCERT
        value: /var/www/html/certs/prod-ca-2021.crt
